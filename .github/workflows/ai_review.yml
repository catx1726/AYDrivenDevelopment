name: AI Code Review Assistant

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # 不限制目标分支：兼容默认分支为 master/main 的子库

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run AI Review
        env:
          # 兼容默认分支为 master/main 的子库（避免硬编码 origin/main）
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # 供应商可配置（repo variables 可覆盖），默认 DeepSeek；兼容任意 OpenAI 风格端点
          AI_API_KEY: ${{ secrets.AI_API_KEY || secrets.DEEPSEEK_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL || 'https://api.deepseek.com' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'deepseek-chat' }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: python scripts/ai_reviewer.py

      - name: Comment PR
        if: hashFiles('review_result.md') != ''
        uses: thollander/actions-comment-pull-request@v2
        with:
          filePath: review_result.md
          comment_tag: ai_code_review
